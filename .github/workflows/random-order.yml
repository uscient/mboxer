name: Random order canary

on:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  random-order:
    name: Random order (pytest-randomly canary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Scheduled workflows live on the default branch but exercise dev.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies and order randomizer
        run: python -m pip install -e ".[test]" "pytest-randomly>=3.15"
      - name: Generate synthetic test fixtures
        run: python tests/fixtures/make_synthetic.py
      # Failure is visible here but does not create a required per-PR check.
      # Reproduce with: pytest -p randomly --randomly-seed=<printed seed>
      - name: Run suite in random order (seed printed for reproduction)
        run: python -m pytest -p randomly -o addopts="--strict-markers --strict-config" --tb=short
