name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check src/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run mypy
        run: mypy src/

  test:
    name: Test + coverage (pytest) / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Generate synthetic test fixtures
        run: python tests/fixtures/make_synthetic.py
      - name: Run pytest with coverage (fails under the pyproject coverage floor)
        run: pytest --tb=short --cov=mboxer --cov-report=term-missing

  random-order:
    name: Random order (pytest-randomly canary)
    runs-on: ubuntu-latest
    # Informational canary: surfaces order-dependence without blocking merges.
    # pytest-randomly prints "Using --randomly-seed=..." so any failure reproduces
    # via `pytest -p randomly --randomly-seed=<seed>`.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Generate synthetic test fixtures
        run: python tests/fixtures/make_synthetic.py
      - name: Run suite in random order (seed printed for reproduction)
        run: python -m pytest -p randomly -o addopts="--strict-markers --strict-config" --tb=short
